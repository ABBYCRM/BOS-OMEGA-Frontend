openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BOS-OMEGA Multi-LLM Orchestration Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Task management
  - name: providers
    description: LLM provider management
  - name: models
    description: LLM model registry
  - name: audit
    description: Audit logs
  - name: memory
    description: Memory management
  - name: fallback
    description: Fallback events
  - name: runs
    description: Execution run traces (Series Pass / Boil The Ocean)
  - name: tri-state
    description: Qubit-inspired tri-state decision vectors
  - name: uploads
    description: File and media uploads (text, code, documents, images, audio, video)
  - name: auth
    description: Authentication and the current user
  - name: users
    description: User management (super_admin only)
  - name: overrides
    description: Super-admin overrides on stuck or held workflows
  - name: local-agent-orgs
    description: Local Automation Agent — organizations (super_admin only)
  - name: local-agent-devices
    description: Local Automation Agent — device registration (public)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tasks:
    post:
      operationId: createTask
      tags: [tasks]
      summary: Submit a task to BOS-OMEGA pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "200":
          description: Task result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get full task trace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task with full trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tasks/stats:
    get:
      operationId: getTaskStats
      tags: [tasks]
      summary: Task statistics and summary
      responses:
        "200":
          description: Task stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStats"

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List all providers
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Add a new provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"

  /providers/{id}:
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update provider settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Remove a provider entirely
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean

  /providers/{id}/api-key:
    put:
      operationId: setProviderApiKey
      tags: [providers]
      summary: Paste an API key for the provider (encrypted at rest)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  description: The plaintext API key — encrypted with AES-256-GCM before storage
              required: [api_key]
      responses:
        "200":
          description: Key stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
    delete:
      operationId: clearProviderApiKey
      tags: [providers]
      summary: Clear the stored API key (falls back to env var)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"

  /providers/{id}/test:
    post:
      operationId: testProvider
      tags: [providers]
      summary: Agentic key validation — tests the configured key against the live provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResult"

  /providers/{id}/discover-models:
    post:
      operationId: discoverProviderModels
      tags: [providers]
      summary: Agentic model discovery — fetches and auto-registers models from the provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDiscoveryResult"

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List model registry
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmModel"
    post:
      operationId: createModel
      tags: [models]
      summary: Add a model to registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"

  /models/{id}:
    patch:
      operationId: updateModel
      tags: [models]
      summary: Update model config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModel"

  /health/providers:
    get:
      operationId: getProviderHealth
      tags: [providers]
      summary: Provider health dashboard
      responses:
        "200":
          description: Provider health status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderHealth"

  /fallback-events:
    get:
      operationId: listFallbackEvents
      tags: [fallback]
      summary: List fallback events
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Fallback events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FallbackEvent"

  /audit:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: task_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /memory:
    get:
      operationId: listMemory
      tags: [memory]
      summary: List memory items
      responses:
        "200":
          description: Memory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryItem"
    post:
      operationId: createMemory
      tags: [memory]
      summary: Create memory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryItem"

  /memory/{id}:
    patch:
      operationId: updateMemory
      tags: [memory]
      summary: Update memory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryItem"
    delete:
      operationId: deleteMemory
      tags: [memory]
      summary: Delete memory item (admin)
      description: Permanently removes a memory item. Deleting a CANON-layer item is irreversible and removes it from every future LLM context.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /tasks/{id}/attempts:
    get:
      operationId: listModelAttempts
      tags: [tasks]
      summary: List model attempts for a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelAttempt"

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List recent execution runs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of execution runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionRun"

  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get execution run detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution run with task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: Not found

  /runs/{id}/series:
    get:
      operationId: getRunSeriesPasses
      tags: [runs]
      summary: Get series pass steps for a run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Series pass steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesPass"

  /runs/{id}/parallel-agents:
    get:
      operationId: getRunParallelAgents
      tags: [runs]
      summary: Get parallel agents for a Boil The Ocean run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parallel agent outputs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParallelAgent"

  /runs/{id}/synthesis:
    get:
      operationId: getRunSynthesis
      tags: [runs]
      summary: Get synthesis report for a Boil The Ocean run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Synthesis report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynthesisReport"
        "404":
          description: Not found

  /tri-state/by-task/{task_id}:
    get:
      operationId: getTriStateByTask
      tags: [tri-state]
      summary: Get qubit-inspired tri-state decision for a task
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tri-state decision with vector and evidence signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriStateDecision"
        "404":
          description: Not found

  /uploads:
    post:
      operationId: uploadFile
      tags: [uploads]
      summary: Upload a file (multipart/form-data, field name "file")
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/{id}:
    get:
      operationId: getAttachment
      tags: [uploads]
      summary: Get attachment metadata
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAttachment
      tags: [uploads]
      summary: Delete an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted: { type: string }
                required: [ok, deleted]

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current authenticated user
      responses:
        "200":
          description: Auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"

  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Sign in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Sign out (clear session cookie)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (super_admin only)
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's role or status (super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          description: Invalid request or self-modification blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user's password to a one-time temporary value (super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /overrides/unlock-task:
    post:
      operationId: overrideUnlockTask
      tags: [overrides]
      summary: Approve and release a HOLD-state task (super_admin only, audited)
      description: |
        Operator approval path for tasks parked on HOLD by the safety / tri-state
        gate. The pipeline has already finished its model attempts before the
        task lands on HOLD, so there is nothing to "resume" — operator review is
        itself the terminal event. Sets tri_state=GO and final_status=COMPLETED
        and records the actor, prior state, and reason in the audit log. To
        explicitly reject a held task instead, use POST /overrides/force-tri-state
        with decision="ABORT".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockTaskBody"
      responses:
        "200":
          description: Unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideTaskResponse"
        "400": { description: Invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Not on HOLD, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /overrides/force-tri-state:
    post:
      operationId: overrideForceTriState
      tags: [overrides]
      summary: Force a tri-state decision past a stuck state (super_admin only, audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForceTriStateBody"
      responses:
        "200":
          description: Forced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideTriStateResponse"
        "400": { description: Invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /overrides/reset-run:
    post:
      operationId: overrideResetRun
      tags: [overrides]
      summary: Reset (cancel) a stuck execution run (super_admin only, audited)
      description: |
        Operator-initiated reset for an execution_run wedged in `running`
        (e.g. provider hang or process restart with no observer to mark it
        terminal). A multi-provider run cannot be safely "rewound and replayed"
        because some attempts have already cost money and emitted side-effects,
        so reset = clean cancel: the run is stamped status="aborted" with
        completed_at set, and the actor/reason are written to the audit log.
        The owner can resubmit a fresh task afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRunBody"
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideRunResponse"
        "400": { description: Invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Already terminal, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /tri-state:
    get:
      operationId: listTriStateDecisions
      tags: [tri-state]
      summary: List recent tri-state decisions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of tri-state decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TriStateDecision"

  /v1/orgs:
    get:
      operationId: listLocalAgentOrgs
      tags: [local-agent-orgs]
      summary: List organizations (super_admin only)
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgListResponse"
        "401": { description: Unauthenticated, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Not super_admin, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      operationId: createLocalAgentOrg
      tags: [local-agent-orgs]
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgBody"
      responses:
        "201":
          description: Org created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgEnvelope"
        "400": { description: Invalid body, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Slug already in use, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /v1/orgs/{id}/rotate-enrollment-secret:
    post:
      operationId: rotateOrgEnrollmentSecret
      tags: [local-agent-orgs]
      summary: Rotate the org's enrollment secret (returned plaintext once)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonOnlyBody"
      responses:
        "200":
          description: New plaintext enrollment secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentSecretResponse"
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /v1/orgs/{id}/devices:
    get:
      operationId: listOrgDevices
      tags: [local-agent-orgs]
      summary: List devices bound to an org
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Devices in the org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDeviceListResponse"

  /v1/orgs/{id}/policy-overrides:
    get:
      operationId: listOrgPolicyOverrides
      tags: [local-agent-orgs]
      summary: List policy locks set by the org
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Policy overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPolicyOverrideListResponse"
    post:
      operationId: setOrgPolicyOverride
      tags: [local-agent-orgs]
      summary: Set or update a policy lock for the org
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOrgPolicyOverrideBody"
      responses:
        "201":
          description: Override set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPolicyOverrideEnvelope"
        "400": { description: Invalid or widening lock, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Org not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /v1/devices/register:
    post:
      operationId: registerLocalAgentDevice
      tags: [local-agent-devices]
      summary: Register a Local Automation Agent device (public, rate-limited)
      parameters:
        - name: install_mode
          in: query
          required: false
          description: Optional duplicate of body.install_mode for MDM URL templating; if present, must match the body.
          schema:
            $ref: "#/components/schemas/InstallMode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceBody"
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
        "400": { description: Invalid body, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Enrollment secret or pair code rejected, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Install-mode downgrade or org not active, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /v1/pair-codes:
    post:
      operationId: mintLocalAgentPairCode
      tags: [local-agent-devices]
      summary: Mint a single-use INDIVIDUAL_CONSENT pair code (super_admin)
      description: |
        Returns the plain-text pair code exactly once. Only the SHA-256 of
        the code is persisted. Hand the plain text to the laptop user; the
        reference agent presents it to /v1/devices/register.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintPairCodeBody"
      responses:
        "201":
          description: Pair code minted (plaintext shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintPairCodeResponse"
        "400": { description: Invalid body, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Unauthenticated, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error]

    CreateTaskBody:
      type: object
      properties:
        input:
          type: string
          description: User input text
        mode:
          type: string
          enum: [single, parallel, consensus, series_pass, boil_the_ocean, auto]
          default: auto
          description: "Execution mode: auto=BOS selects best mode, series_pass=5-role sequential refinement, boil_the_ocean=parallel multi-LLM × N agents + synthesis + adversarial"
        task_type_override:
          type: string
          description: Optional override for task classification
        parallel_models:
          type: integer
          description: Number of models to run in parallel (for parallel/consensus mode)
          default: 3
        max_models:
          type: integer
          description: Max LLM providers to use in Boil The Ocean mode (default 5)
          default: 5
        agents_per_model:
          type: integer
          description: Number of specialized agents per model in Boil The Ocean mode (default 5)
          default: 5
        attachment_ids:
          type: array
          description: IDs of files previously uploaded via POST /uploads to attach to this task
          items:
            type: string
        persona:
          type: string
          enum: [legal, engineering, cyber]
          description: "Optional domain persona overlay applied to every model call. Composes with the Master Prompt Kernel — does not replace it. Personas reshape the answer content while preserving BOS schema and governance."
      required: [input]

    Task:
      type: object
      properties:
        id:
          type: string
        input_text:
          type: string
        task_type:
          type: string
        tri_state:
          type: string
          enum: [GO, HOLD, ABORT]
        selected_provider:
          type: string
        selected_model:
          type: string
        final_status:
          type: string
        final_output:
          type: string
        mode:
          type: string
        created_at:
          type: string
      required: [id, input_text, task_type, tri_state, final_status, created_at]

    TaskDetail:
      type: object
      properties:
        task:
          $ref: "#/components/schemas/Task"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/ModelAttempt"
        validation:
          type: array
          items:
            $ref: "#/components/schemas/ValidationResult"
        fallbacks:
          type: array
          items:
            $ref: "#/components/schemas/FallbackEvent"
        audit:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        bos_output:
          $ref: "#/components/schemas/BosOutput"
        run_id:
          type: string
          nullable: true
          description: Latest execution_run id associated with this task, if any. Used by super-admin override UI to enable run-level actions without scraping audit metadata.
      required: [task, attempts, validation, fallbacks, audit]

    Attachment:
      type: object
      properties:
        id: { type: string }
        task_id:
          type: string
          nullable: true
        original_name: { type: string }
        mime: { type: string }
        kind:
          type: string
          enum: [image, document, spreadsheet, code, text, audio, video, other]
        size_bytes: { type: integer }
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        extraction_status:
          type: string
          enum: [pending, done, skipped, failed]
        extraction_error:
          type: string
          nullable: true
        extraction_chars:
          type: integer
          description: Number of characters of extracted text the server is holding for this attachment
        has_thumbnail: { type: boolean }
        created_at:
          type: string
          format: date-time
      required:
        [id, original_name, mime, kind, size_bytes, extraction_status, extraction_chars, has_thumbnail, created_at]

    TaskListResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [tasks, total, limit, offset]

    TaskStats:
      type: object
      properties:
        total_tasks:
          type: integer
        go_count:
          type: integer
        hold_count:
          type: integer
        abort_count:
          type: integer
        avg_latency_ms:
          type: number
        total_cost_estimate:
          type: number
        tasks_by_type:
          type: object
          additionalProperties:
            type: integer
        tasks_by_provider:
          type: object
          additionalProperties:
            type: integer
        fallback_count:
          type: integer
        success_rate:
          type: number
      required: [total_tasks, go_count, hold_count, abort_count]

    Provider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        base_url:
          type: string
        status:
          type: string
          enum: [HEALTHY, DEGRADED, OPEN_CIRCUIT, RECOVERY_TEST]
        enabled:
          type: boolean
        priority:
          type: integer
        api_key_env:
          type: string
          description: Optional env var name (legacy fallback)
        api_key_hint:
          type: string
          description: Last 4 chars of the configured key (or null)
        has_api_key:
          type: boolean
          description: True if a DB-stored encrypted key exists
        last_test_status:
          type: string
          enum: [OK, FAILED, NEVER_TESTED]
        last_test_message:
          type: string
        last_test_at:
          type: string
        discovered_models_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required: [id, name, status, enabled, priority]

    ProviderTestResult:
      type: object
      properties:
        ok:
          type: boolean
        status_code:
          type: integer
        message:
          type: string
        detected_provider:
          type: string
      required: [ok, message]

    ProviderDiscoveryResult:
      type: object
      properties:
        discovered:
          type: integer
        newly_registered:
          type: integer
        models:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              context_window:
                type: integer
            required: [id]
      required: [discovered, newly_registered, models]

    CreateProviderBody:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
        priority:
          type: integer
          default: 5
        api_key_env:
          type: string
          description: Name of env variable holding the API key
      required: [name]

    UpdateProviderBody:
      type: object
      properties:
        status:
          type: string
          enum: [HEALTHY, DEGRADED, OPEN_CIRCUIT, RECOVERY_TEST]
        enabled:
          type: boolean
        priority:
          type: integer
        base_url:
          type: string

    LlmModel:
      type: object
      properties:
        id:
          type: string
        provider_id:
          type: string
        provider_name:
          type: string
        model_name:
          type: string
        capability_tags:
          type: array
          items:
            type: string
        context_window:
          type: integer
        cost_input:
          type: number
        cost_output:
          type: number
        reliability_score:
          type: number
        latency_score:
          type: number
        enabled:
          type: boolean
      required: [id, provider_id, model_name, capability_tags, enabled]

    CreateModelBody:
      type: object
      properties:
        provider_id:
          type: string
        model_name:
          type: string
        capability_tags:
          type: array
          items:
            type: string
        context_window:
          type: integer
          default: 8192
        cost_input:
          type: number
          default: 0
        cost_output:
          type: number
          default: 0
        reliability_score:
          type: number
          default: 0.9
        latency_score:
          type: number
          default: 0.8
      required: [provider_id, model_name, capability_tags]

    UpdateModelBody:
      type: object
      properties:
        capability_tags:
          type: array
          items:
            type: string
        context_window:
          type: integer
        cost_input:
          type: number
        cost_output:
          type: number
        reliability_score:
          type: number
        latency_score:
          type: number
        enabled:
          type: boolean

    ModelAttempt:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        provider:
          type: string
        model:
          type: string
        attempt_number:
          type: integer
        status:
          type: string
        error_type:
          type: string
        latency_ms:
          type: number
        token_input:
          type: integer
        token_output:
          type: integer
        cost_estimate:
          type: number
        raw_response:
          type: string
        is_parallel:
          type: boolean
        parallel_group:
          type: string
        created_at:
          type: string
      required: [id, task_id, provider, model, attempt_number, status, created_at]

    ValidationResult:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        attempt_id:
          type: string
        schema_pass:
          type: boolean
        safety_pass:
          type: boolean
        instruction_pass:
          type: boolean
        completeness_pass:
          type: boolean
        confidence_score:
          type: number
        notes:
          type: string
      required: [id, task_id, schema_pass, safety_pass, instruction_pass, completeness_pass, confidence_score]

    FallbackEvent:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        from_provider:
          type: string
        from_model:
          type: string
        to_provider:
          type: string
        to_model:
          type: string
        reason:
          type: string
        created_at:
          type: string
      required: [id, task_id, reason, created_at]

    ProviderHealth:
      type: object
      properties:
        id:
          type: string
        provider_id:
          type: string
        provider_name:
          type: string
        status:
          type: string
          enum: [HEALTHY, DEGRADED, OPEN_CIRCUIT, RECOVERY_TEST]
        failure_count:
          type: integer
        last_failure:
          type: string
        last_success:
          type: string
        avg_latency_ms:
          type: number
      required: [id, provider_id, status, failure_count]

    AuditLog:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        event_type:
          type: string
        message:
          type: string
        metadata:
          type: object
        created_at:
          type: string
      required: [id, event_type, message, created_at]

    MemoryItem:
      type: object
      properties:
        id:
          type: string
        layer:
          type: string
          enum: [canon, patches, continuity, logs, scratchpad]
        title:
          type: string
        content:
          type: string
        authority_level:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
      required: [id, layer, title, content, authority_level]

    CreateMemoryBody:
      type: object
      properties:
        layer:
          type: string
          enum: [canon, patches, continuity, logs, scratchpad]
        title:
          type: string
        content:
          type: string
        authority_level:
          type: integer
          default: 5
      required: [layer, title, content]

    UpdateMemoryBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        authority_level:
          type: integer
        layer:
          type: string
          enum: [canon, patches, continuity, logs, scratchpad]

    BosOutput:
      type: object
      properties:
        state:
          type: string
          enum: [GO, HOLD, ABORT]
        task_type:
          type: string
        answer:
          type: string
        assumptions:
          type: array
          items:
            type: string
        uncertainties:
          type: array
          items:
            type: string
        missing_inputs:
          type: array
          items:
            type: string
        failure_modes:
          type: array
          items:
            type: string
        recommended_next_action:
          type: string
        parallel_responses:
          type: array
          items:
            $ref: "#/components/schemas/ParallelResponse"
        merge_strategy:
          type: string
      required: [state, task_type, answer]

    ParallelResponse:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        state:
          type: string
        answer:
          type: string
        confidence_score:
          type: number
        latency_ms:
          type: number
        selected:
          type: boolean
      required: [provider, model, state, answer]

    ExecutionRun:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        mode:
          type: string
          enum: [normal, series_pass, boil_the_ocean]
        status:
          type: string
          enum: [running, completed, failed, held, aborted]
        total_passes:
          type: integer
        total_agents:
          type: integer
        models_used:
          type: array
          items:
            type: string
        final_score:
          type: number
        started_at:
          type: string
        completed_at:
          type: string
      required: [id, mode, status, started_at]

    SeriesPass:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        pass_number:
          type: integer
        provider:
          type: string
        model:
          type: string
        role:
          type: string
          enum: [DRAFTER, CRITIC, EXPANDER, ADVERSARY, SYNTHESIZER, OMEGA_VALIDATOR]
        input_snapshot:
          type: string
        output_snapshot:
          type: string
        validation_score:
          type: number
        errors_found:
          type: array
          items:
            type: string
        state:
          type: string
          enum: [GO, HOLD, ABORT]
        latency_ms:
          type: integer
        created_at:
          type: string
      required: [id, run_id, pass_number, provider, model, role]

    ParallelAgent:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        provider:
          type: string
        model:
          type: string
        agent_role:
          type: string
          enum: [ARCHITECT, CRITIC, RESEARCHER, BUILDER, VALIDATOR]
        status:
          type: string
          enum: [pending, running, completed, failed]
        output:
          type: string
        score:
          type: number
        state:
          type: string
          enum: [GO, HOLD, ABORT]
        error_type:
          type: string
        latency_ms:
          type: integer
        created_at:
          type: string
      required: [id, run_id, provider, model, agent_role, status]

    SynthesisReport:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        consensus_points:
          type: array
          items:
            type: string
        contradictions:
          type: array
          items:
            type: string
        strongest_sections:
          type: array
          items:
            type: string
        rejected_sections:
          type: array
          items:
            type: string
        final_synthesis:
          type: string
        omega_validation:
          type: string
          description: JSON string with omega validation result
        created_at:
          type: string
      required: [id, run_id]

    RunDetail:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/ExecutionRun"
        task:
          $ref: "#/components/schemas/Task"
      required: [run]

    TriStateDecision:
      type: object
      description: Qubit-inspired probabilistic tri-state decision. The vector is advisory until collapsed; only the final_state controls execution.
      properties:
        id:
          type: string
        task_id:
          type: string
        go_score:
          type: number
          description: GO amplitude (0..1) — probability before collapse
        hold_score:
          type: number
          description: HOLD amplitude (0..1) — probability before collapse
        abort_score:
          type: number
          description: ABORT amplitude (0..1) — probability before collapse
        evidence_signals:
          type: string
          description: JSON-encoded array of evidence signals that updated the amplitudes
        collapse_reason:
          type: string
          description: Why the collapse function chose this state
        final_state:
          type: string
          enum: [GO, HOLD, ABORT]
          description: The collapsed runtime state — only this controls execution
        confidence_score:
          type: number
          description: How dominant the chosen amplitude was at collapse time
        created_at:
          type: string
      required: [id, go_score, hold_score, abort_score, collapse_reason, final_state]

    AuthMeResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [authenticated]

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin, super_admin]
      required: [id, email, role]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        ok:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [ok, user]

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin, super_admin]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
        updated_at:
          type: string
        last_login_at:
          type: string
          nullable: true
      required: [id, email, role, status, created_at, updated_at]

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required: [users]

    UserEnvelope:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    CreateUserBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256
        role:
          type: string
          enum: [user, admin, super_admin]
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required: [email, password, role, reason]

    UpdateUserBody:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin, super_admin]
        status:
          type: string
          enum: [active, disabled]
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required: [reason]

    ResetPasswordBody:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required: [reason]

    ResetPasswordResponse:
      type: object
      properties:
        ok:
          type: boolean
        temporary_password:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [ok, temporary_password, user]

    UnlockTaskBody:
      type: object
      properties:
        task_id:
          type: string
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required: [task_id, reason]

    ForceTriStateBody:
      type: object
      properties:
        task_id:
          type: string
        decision:
          type: string
          enum: [GO, HOLD, ABORT]
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required: [task_id, decision, reason]

    ResetRunBody:
      type: object
      properties:
        run_id:
          type: string
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required: [run_id, reason]

    OverrideTaskResponse:
      type: object
      properties:
        ok:
          type: boolean
        task_id:
          type: string
      required: [ok, task_id]

    OverrideTriStateResponse:
      type: object
      properties:
        ok:
          type: boolean
        task_id:
          type: string
        tri_state:
          type: string
          enum: [GO, HOLD, ABORT]
      required: [ok, task_id, tri_state]

    OverrideRunResponse:
      type: object
      properties:
        ok:
          type: boolean
        run_id:
          type: string
      required: [ok, run_id]

    InstallMode:
      type: string
      enum: [INDIVIDUAL_CONSENT, ADMIN_DEPLOYMENT]
      description: |
        Local-Agent install mode. INDIVIDUAL_CONSENT (default) is a personal
        device paired via 6-char pair code. ADMIN_DEPLOYMENT is a
        managed-fleet device paired with an org enrollment secret.

    Org:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, archived] }
        has_enrollment_secret: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, slug, display_name, status, has_enrollment_secret, created_at, updated_at]

    OrgListResponse:
      type: object
      properties:
        orgs:
          type: array
          items: { $ref: "#/components/schemas/Org" }
      required: [orgs]

    OrgEnvelope:
      type: object
      properties:
        org: { $ref: "#/components/schemas/Org" }
      required: [org]

    CreateOrgBody:
      type: object
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required: [slug, display_name, reason]

    ReasonOnlyBody:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required: [reason]

    EnrollmentSecretResponse:
      type: object
      description: |
        Plaintext enrollment secret. Returned ONCE on rotation; never
        persisted in plaintext server-side.
      properties:
        enrollment_secret: { type: string }
      required: [enrollment_secret]

    OrgDevice:
      type: object
      properties:
        id: { type: string }
        org_id:
          type: string
          nullable: true
        install_mode: { $ref: "#/components/schemas/InstallMode" }
        display_name: { type: string }
        hostname:
          type: string
          nullable: true
        status: { type: string }
        paired_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        contract_version: { type: string }
      required: [id, org_id, install_mode, display_name, status, paired_at, contract_version]

    OrgDeviceListResponse:
      type: object
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/OrgDevice" }
      required: [devices]

    OrgPolicyOverride:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        policy_field_path:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}(\\.[a-z][a-z0-9_]{0,63}){0,15}$"
        locked_value: {}
        set_by_user_id: { type: string }
        set_at: { type: string, format: date-time }
      required: [id, org_id, policy_field_path, locked_value, set_by_user_id, set_at]

    OrgPolicyOverrideListResponse:
      type: object
      properties:
        overrides:
          type: array
          items: { $ref: "#/components/schemas/OrgPolicyOverride" }
      required: [overrides]

    OrgPolicyOverrideEnvelope:
      type: object
      properties:
        override: { $ref: "#/components/schemas/OrgPolicyOverride" }
      required: [override]

    SetOrgPolicyOverrideBody:
      type: object
      properties:
        policy_field_path:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}(\\.[a-z][a-z0-9_]{0,63}){0,15}$"
        locked_value: {}
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required: [policy_field_path, locked_value, reason]

    RegisterDeviceBody:
      type: object
      properties:
        install_mode: { $ref: "#/components/schemas/InstallMode" }
        pair_code:
          type: string
          minLength: 4
          maxLength: 64
          description: Required when install_mode = INDIVIDUAL_CONSENT.
        org_enrollment_secret:
          type: string
          minLength: 32
          maxLength: 512
          description: Required when install_mode = ADMIN_DEPLOYMENT. Hashed (SHA-256) server-side and looked up against bos_orgs.enrollment_secret_hash.
        device_pubkey:
          type: string
          minLength: 32
          maxLength: 4096
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        hostname:
          type: string
          minLength: 1
          maxLength: 255
        contract_version:
          type: string
          minLength: 1
          maxLength: 32
      required: [install_mode, device_pubkey, display_name, contract_version]

    RegisterDeviceResponse:
      type: object
      properties:
        device_id: { type: string }
        org_id:
          type: string
          nullable: true
        install_mode: { $ref: "#/components/schemas/InstallMode" }
        signing_secret:
          type: string
          minLength: 32
          maxLength: 256
          description: >
            Per-device HMAC signing secret. Returned exactly once, on
            registration. The agent MUST persist this in OS-protected
            local storage; subsequent calls to /api/v1/task-requests
            and /api/v1/task-requests/{id}/execute are signed with it
            via the X-BOS-Signature header.
      required: [device_id, org_id, install_mode, signing_secret]

    MintPairCodeBody:
      type: object
      properties:
        ttl_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: How long the code remains redeemable (default 15)

    MintPairCodeResponse:
      type: object
      properties:
        id: { type: string }
        pair_code:
          type: string
          description: Plain-text code shown exactly once; persist immediately on the operator side
        expires_at: { type: string, format: date-time }
      required: [id, pair_code, expires_at]
