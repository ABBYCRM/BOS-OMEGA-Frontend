kind = "web"
previewPath = "/"
title = "BOS-OMEGA"
version = "1.0.0"
id = "artifacts/bos-omega"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19946

[services.development]
run = "pnpm --filter @workspace/bos-omega run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bos-omega", "run", "build" ]
publicDir = "artifacts/bos-omega/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19946"
BASE_PATH = "/"
